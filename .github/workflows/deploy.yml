name: CI/CD Pipeline - Test & Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ====================================================================
  # JOB 1: VALIDACIÓN Y PRUEBAS UNITARIAS DE BACKEND (QAAgent)
  # ====================================================================
  test-backend:
    name: Run Backend Unit Tests (QAAgent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Test Suite
        working-directory: ./backend
        run: npm test

  # ====================================================================
  # JOB 2: VALIDACIÓN Y BUILD DE FRONTEND REACT (FrontendAgent)
  # ====================================================================
  build-frontend:
    name: Build React SPA (FrontendAgent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React Application
        working-directory: ./frontend
        run: npm run build

  # ====================================================================
  # JOB 3: DESPLIEGUE DOCKER EN AWS EC2 (DeployAgent)
  # ====================================================================
  deploy:
    name: Deploy Multi-Container Stack to AWS EC2
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Iniciando despliegue de stack desacoplado en AWS EC2..."
            sudo mkdir -p /var/www/jacintillo-app
            sudo chown -R $USER:$USER /var/www/jacintillo-app
            cd /var/www/jacintillo-app
            
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi

            echo "🐳 Compilando imágenes con motor nativo de Docker..."
            sudo docker build -t jacintillo-backend:latest ./backend
            sudo docker build -t jacintillo-frontend:latest ./frontend

            echo "🐳 Desplegando y actualizando Contenedores en caliente (Zero Downtime)..."
            sudo docker compose up -d --no-build

            echo "✅ Verificando estado de los servicios..."
            sudo docker compose ps
